<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient -->
    <radialGradient id="badgeBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#181428"/>
      <stop offset="60%" stop-color="#0E0C18"/>
      <stop offset="100%" stop-color="#06050A"/>
    </radialGradient>

    <!-- Outer Glow Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="30%" stop-color="#FF5722"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Left Pillar Gradient (Violet-Indigo) -->
    <linearGradient id="leftPillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="40%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Right Pillar Gradient (Amber-Coral-Gold) -->
    <linearGradient id="rightPillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="35%" stop-color="#FFA000"/>
      <stop offset="85%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#E91E63"/>
    </linearGradient>

    <!-- Center Bridge Hub Gradient -->
    <linearGradient id="hubBeam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="40%" stop-color="#FFA000"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#FF6F00"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="hubGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Rounded Shield Canvas (Squircle) -->
  <rect x="12" y="12" width="488" height="488" rx="128" fill="url(#badgeBg)"/>
  <rect x="12" y="12" width="488" height="488" rx="128" fill="none" stroke="url(#borderGrad)" stroke-width="4" opacity="0.65"/>

  <!-- Subtle Interior Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="#8B5CF6" opacity="0.12" filter="url(#hubGlow)"/>
  <circle cx="256" cy="256" r="85" fill="#FFA000" opacity="0.18" filter="url(#hubGlow)"/>

  <!-- ── THE "H" EMBLEM: Modern Dynamic Campus Architecture ── -->

  <!-- Left Modern Wing (Hostel Residence Pillar) -->
  <path d="M 148 116 
           C 148 100, 160 90, 176 90 
           L 204 90 
           C 218 90, 228 100, 228 116 
           L 228 396 
           C 228 412, 218 422, 204 422 
           L 176 422 
           C 160 422, 148 412, 148 396 Z"
        fill="url(#leftPillar)" filter="url(#hubGlow)"/>

  <!-- Left Angled Roof Cap -->
  <path d="M 148 136 L 188 82 L 228 136 Z" fill="#E9D5FF" opacity="0.5"/>

  <!-- Right Modern Wing (Hostel Residence Pillar) -->
  <path d="M 284 116 
           C 284 100, 294 90, 308 90 
           L 336 90 
           C 352 90, 364 100, 364 116 
           L 364 396 
           C 364 412, 352 422, 336 422 
           L 308 422 
           C 294 422, 284 412, 284 396 Z"
        fill="url(#rightPillar)" filter="url(#hubGlow)"/>

  <!-- Right Angled Roof Cap -->
  <path d="M 284 136 L 324 82 L 364 136 Z" fill="#FFF3E0" opacity="0.5"/>

  <!-- Central Interconnected Bridge (Crossbeam of H) -->
  <path d="M 212 232 
           L 300 232 
           C 314 232, 322 242, 322 256 
           C 322 270, 314 280, 300 280 
           L 212 280 
           C 198 280, 190 270, 190 256 
           C 190 242, 198 232, 212 232 Z"
        fill="url(#hubBeam)" filter="url(#hubGlow)"/>

  <!-- Radiant Central Marketplace Portal (The Hub) -->
  <circle cx="256" cy="256" r="38" fill="#0E0C18" stroke="url(#rightPillar)" stroke-width="5"/>
  <circle cx="256" cy="256" r="22" fill="#FFA000" filter="url(#hubGlow)"/>
  
  <!-- 4-Point Campus Spark / Star in Center -->
  <path d="M 256 240 
           Q 256 256 272 256 
           Q 256 256 256 272 
           Q 256 256 240 256 
           Q 256 256 256 240 Z" 
        fill="#FFFFFF"/>

  <!-- Upper Connection Arc (Community Bridge) -->
  <path d="M 188 80 Q 256 36 324 80" fill="none" stroke="url(#borderGrad)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="8 6" opacity="0.8"/>

  <!-- Lower Anchor Arc -->
  <path d="M 188 432 Q 256 468 324 432" fill="none" stroke="url(#borderGrad)" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>
</svg>
