<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hhBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19142b"/>
      <stop offset="50%" stop-color="#0f0c1c"/>
      <stop offset="100%" stop-color="#08070e"/>
    </linearGradient>

    <!-- Glowing Amber Brand Gradient -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="40%" stop-color="#FFB300"/>
      <stop offset="85%" stop-color="#F57C00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>

    <!-- Electric Violet Accent -->
    <linearGradient id="violetGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="60%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Ambient Shadow & Glow Filters -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="sparkle" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect x="6" y="6" width="188" height="188" rx="46" fill="url(#hhBg)" stroke="rgba(245, 166, 35, 0.28)" stroke-width="2.5"/>

  <!-- Radial Core Glow -->
  <circle cx="100" cy="100" r="70" fill="#FFB300" opacity="0.12" filter="blur(24px)"/>
  <circle cx="120" cy="80" r="45" fill="#7C5CFF" opacity="0.15" filter="blur(20px)"/>

  <!-- ─── Architectural Hostel Tower Left ─── -->
  <path d="M 48 148 L 48 76 C 48 70 53 66 60 66 L 70 66 C 76 66 80 70 80 76 L 80 148 C 80 152 76 156 70 156 L 60 156 C 53 156 48 152 48 148 Z"
        fill="url(#amberGlow)" filter="url(#softGlow)"/>

  <!-- Windows in Left Tower -->
  <rect x="58" y="80" width="12" height="10" rx="3" fill="#13101E" opacity="0.75"/>
  <rect x="58" y="98" width="12" height="10" rx="3" fill="#13101E" opacity="0.75"/>
  <rect x="58" y="116" width="12" height="10" rx="3" fill="#13101E" opacity="0.75"/>

  <!-- ─── Architectural Hostel Tower Right ─── -->
  <path d="M 120 148 L 120 76 C 120 70 125 66 132 66 L 142 66 C 148 66 152 70 152 76 L 152 148 C 152 152 148 156 142 156 L 132 156 C 125 156 120 152 120 148 Z"
        fill="url(#violetGlow)" filter="url(#softGlow)"/>

  <!-- Windows in Right Tower -->
  <rect x="130" y="80" width="12" height="10" rx="3" fill="#13101E" opacity="0.75"/>
  <rect x="130" y="98" width="12" height="10" rx="3" fill="#13101E" opacity="0.75"/>
  <rect x="130" y="116" width="12" height="10" rx="3" fill="#13101E" opacity="0.75"/>

  <!-- ─── Community Central Connecting Bridge (forming 'H') ─── -->
  <rect x="76" y="98" width="48" height="18" rx="6" fill="url(#amberGlow)" filter="url(#softGlow)"/>

  <!-- Express Campus Delivery / Handover Loop Arrow -->
  <path d="M 72 52 C 90 38 122 40 138 54" stroke="url(#amberGlow)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9" filter="url(#softGlow)"/>
  <!-- Arrow Head -->
  <polygon points="144,56 136,46 142,42" fill="#FFE082"/>

  <!-- Central Exchange Hub Indicator Pulse -->
  <circle cx="100" cy="107" r="5" fill="#FFFFFF"/>
  <circle cx="100" cy="107" r="10" fill="none" stroke="#FFE082" stroke-width="2" opacity="0.85"/>

  <!-- ─── Ambient Stars / Sparkles ─── -->
  <path d="M 160 40 Q 160 48 168 48 Q 160 48 160 56 Q 160 48 152 48 Q 160 48 160 40 Z" fill="#FFE082" filter="url(#sparkle)"/>
  <circle cx="36" cy="48" r="2.5" fill="#FFE082" opacity="0.7"/>
  <circle cx="166" cy="150" r="2.5" fill="#C084FC" opacity="0.7"/>
</svg>
