<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1A1528"/>
      <stop offset="55%" stop-color="#0E0C16"/>
      <stop offset="100%" stop-color="#07060B"/>
    </radialGradient>

    <!-- Amber Glow Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC837"/>
      <stop offset="60%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>

    <!-- Violet Purple Gradient -->
    <linearGradient id="violetGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="70%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Bridge Beam Gradient -->
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB020"/>
      <stop offset="50%" stop-color="#FFF"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>

    <!-- Outer Ambient Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="hubGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Rounded Base with Subtle Border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(245, 166, 35, 0.22)" stroke-width="3"/>

  <!-- Ambient Light Orbs -->
  <circle cx="256" cy="256" r="160" fill="#7C3AED" opacity="0.18" filter="url(#hubGlow)"/>
  <circle cx="256" cy="256" r="90" fill="#FF9900" opacity="0.25" filter="url(#hubGlow)"/>

  <!-- Left Hostel Residence Tower -->
  <path d="M 124 136 
           C 124 118, 138 104, 156 104 
           L 188 104 
           C 206 104, 220 118, 220 136 
           L 220 376 
           C 220 394, 206 408, 188 408 
           L 156 408 
           C 138 408, 124 394, 124 376 Z" 
        fill="url(#violetGrad)" 
        filter="url(#softGlow)"/>

  <!-- Right Hostel Residence Tower -->
  <path d="M 292 136 
           C 292 118, 306 104, 324 104 
           L 356 104 
           C 374 104, 388 118, 388 136 
           L 388 376 
           C 388 394, 374 408, 356 408 
           L 324 408 
           C 306 408, 292 394, 292 376 Z" 
        fill="url(#amberGrad)" 
        filter="url(#softGlow)"/>

  <!-- Architectural Tower Windows (Left Tower) -->
  <rect x="156" y="152" width="32" height="18" rx="5" fill="#FFFFFF" opacity="0.85"/>
  <rect x="156" y="196" width="32" height="18" rx="5" fill="#DDD6FE" opacity="0.7"/>
  <rect x="156" y="302" width="32" height="18" rx="5" fill="#DDD6FE" opacity="0.7"/>
  <rect x="156" y="346" width="32" height="18" rx="5" fill="#DDD6FE" opacity="0.6"/>

  <!-- Architectural Tower Windows (Right Tower) -->
  <rect x="324" y="152" width="32" height="18" rx="5" fill="#FFFFFF" opacity="0.85"/>
  <rect x="324" y="196" width="32" height="18" rx="5" fill="#FEF3C7" opacity="0.75"/>
  <rect x="324" y="302" width="32" height="18" rx="5" fill="#FEF3C7" opacity="0.75"/>
  <rect x="324" y="346" width="32" height="18" rx="5" fill="#FEF3C7" opacity="0.6"/>

  <!-- Interconnecting Campus Bridge (The "H" crossbar) -->
  <rect x="200" y="232" width="112" height="48" rx="14" fill="url(#bridgeGrad)" filter="url(#softGlow)"/>

  <!-- Central Glowing Campus Hub Portal -->
  <circle cx="256" cy="256" r="32" fill="#0B0910" stroke="url(#amberGrad)" stroke-width="6"/>
  <circle cx="256" cy="256" r="16" fill="#FFC837" filter="url(#softGlow)"/>
  <circle cx="256" cy="256" r="8" fill="#FFFFFF"/>

  <!-- Dynamic Campus Connection Arcs -->
  <path d="M 172 96 C 220 54, 292 54, 340 96" fill="none" stroke="url(#amberGrad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8" opacity="0.65"/>
  <path d="M 188 416 C 226 442, 286 442, 324 416" fill="none" stroke="url(#violetGrad)" stroke-width="4" stroke-linecap="round" opacity="0.65"/>
</svg>
